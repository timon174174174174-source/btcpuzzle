name: Build Windows (CUDA)

# Builds VanitySearch.exe (with save/resume) on a GitHub-hosted Windows runner.
# Installs CUDA toolkit + vcpkg deps, builds Release|x64 via MSBuild, and uploads
# the .exe + runtime DLLs as a downloadable artifact. No local toolchain needed.

on:
  workflow_dispatch: {}
  push:
    branches:
      - feature/save-resume-progress

jobs:
  unit-tests:
    # No-GPU unit tests (checkpoint I/O, range/resume arithmetic).
    runs-on: ubuntu-latest
    container: gcc:9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkpoint tests
        run: g++ -O2 -std=c++17 -IPool tests/test_checkpoint.cpp Pool/Checkpoint.cpp -o /tmp/tc && /tmp/tc

      - name: RangeMath tests
        run: g++ -O2 -std=c++17 -mssse3 -Wno-write-strings -I. tests/test_rangemath.cpp RangeMath.cpp Int.cpp IntMod.cpp IntGroup.cpp Random.cpp Timer.cpp -lpthread -o /tmp/trm && /tmp/trm

  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit 12.9
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda
        with:
          cuda: '12.9.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
          use-github-cache: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install vcpkg dependencies (curl, openssl, zlib)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install curl:x64-windows openssl:x64-windows zlib:x64-windows
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install

      - name: Create local.props with BUILD_HASH
        shell: pwsh
        run: |
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <Project xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <ItemDefinitionGroup>
              <ClCompile>
                <PreprocessorDefinitions>BUILD_HASH="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef";%(PreprocessorDefinitions)</PreprocessorDefinitions>
              </ClCompile>
            </ItemDefinitionGroup>
          </Project>
          '@ | Set-Content local.props

      - name: Build (Release x64)
        shell: pwsh
        env:
          # Tolerate a newer MSVC than the CUDA toolkit officially lists.
          NVCC_PREPEND_FLAGS: '-allow-unsupported-compiler'
        run: |
          msbuild VanitySearch.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Collect artifact (exe + runtime DLLs + pool.conf)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item x64\Release\VanitySearch.exe out\
          Copy-Item pool.conf out\
          # Copy every release DLL vcpkg produced (libcrypto, libcurl, zlib1, libssl, ...)
          $bin = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          Copy-Item "$bin\*.dll" out\
          # Verify the exe's DLL dependencies are all present (uses dumpbin from the runner's MSVC)
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vc = & $vswhere -latest -products * -find '**\dumpbin.exe' | Select-Object -First 1
          if ($vc) { & $vc /dependents out\VanitySearch.exe | Select-String -Pattern '\.dll' }
          Get-ChildItem out\ | Format-Table Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VanitySearch-windows-x64
          path: out/**
